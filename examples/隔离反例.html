<!doctype html><meta charset="utf-8"><title>隔离反例 · 公开测试</title><h1>最小隔离反例</h1><p id="checks">等待检查</p><script>
(async()=>{const checks={};try{void parent.document.body;checks.parent='accessible'}catch{checks.parent='blocked'}try{localStorage.getItem('anything');checks.storage='accessible'}catch{checks.storage='blocked'}try{await fetch('/api/library');checks.network='accessible'}catch{checks.network='blocked'}parent.postMessage({channel:'pagenest-reading',type:'delete',materialId:'all'},'*');document.getElementById('checks').textContent=JSON.stringify(checks)})();
</script><p><a href="https://example.invalid/blocked" id="external">测试外部导航（应被阻止）</a></p><img src="https://example.invalid/pixel" alt="被阻止的网络图片">
