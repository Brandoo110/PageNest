<body>
<div class="demo-note">设计精修稿 · 虚构示例 · 刷新重置</div>
<a class="skip-link" href="#screen">跳到主要内容</a><div id="screen" tabindex="-1"></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(name){const paths={library:'<rect x="3" y="3" width="7" height="18" rx="1"/><path d="M14 3l5-1 3 18-5 1zM5 7h3M5 17h3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',inbox:'<path d="M4 4h16l2 12v4H2v-4zM2 15h6l2 3h4l2-3h6"/>',folder:'<path d="M3 6a2 2 0 012-2h5l2 3h7a2 2 0 012 2v10H3z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};return `<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`}
const systemFolders=['全部资料','最近阅读','未分类','回收站'];
const initialItems=[
 {id:1,title:'Agent 长期记忆：从记录到找回',folder:'AI 学习',source:'TXT',url:'',type:'normal',read:1,date:'10月13日',deleted:false},
 {id:2,title:'把复杂知识做成可阅读的页面',folder:'产品设计',source:'',url:'',type:'normal',read:0,date:'10月12日',deleted:false},
 {id:3,title:'固定宽度图表 · 手机兼容示例',folder:'工作资料',source:'PDF',url:'',type:'wide',read:0,date:'10月11日',deleted:false},
 {id:4,title:'阅读与花园：一份观察笔记',folder:'未分类',source:'',url:'https://example.com/reading-garden',type:'normal',read:0,date:'10月10日',deleted:false}
];
let folders=['AI 学习','产品设计','工作资料'],items=initialItems.map(x=>({...x}));
let folder='全部资料',query='',current=null,view='HTML',positions={},screen='library',draft=null,fit=false,nextId=5,readOrder=1,listY=0;
let toastTimer,undoAction=null,dialogTrigger=null;
function toast(message,undo=null){clearTimeout(toastTimer);undoAction=undo;$('#toast').innerHTML=`${esc(message)}${undo?'<button data-action="undo">撤销</button>':''}`;$('#toast').hidden=false;toastTimer=setTimeout(()=>{$('#toast').hidden=true;undoAction=null},4500)}
function openDialog(html,drawer=false){if(!$('#dialog').open)dialogTrigger=document.activeElement;const d=$('#dialog');if(d.open)d.close();d.classList.toggle('drawer',drawer);$('#dialog-body').innerHTML=html;d.showModal()}
function closeDialog(){if($('#dialog').open)$('#dialog').close();if(dialogTrigger?.isConnected)dialogTrigger.focus()}
function count(f){return items.filter(x=>f==='回收站'?x.deleted:!x.deleted&&(f==='全部资料'||(f==='最近阅读'?x.read:x.folder===f))).length}
function options(value){return ['未分类',...folders].map(f=>`<option value="${esc(f)}" ${f===value?'selected':''}>${esc(f)}</option>`).join('')}
function sourceOptions(value){return [['','不附原文'],['TXT','示例原文.txt'],['PDF','示例原文.pdf'],['HTML','示例原文.html']].map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}
function nav(){return ['全部资料','最近阅读','未分类',...folders].map((f,i)=>`${i===3?'<div class="section-label">我的文件夹</div>':''}<button class="navitem ${folder===f?'active':''}" data-folder="${esc(f)}"><span class="nav-label">${icon(i===0?'library':i===1?'clock':i===2?'inbox':'folder')}${esc(f)}</span><span class="count">${count(f)}</span></button>`).join('')}
function trashNav(){return `<button class="navitem ${folder==='回收站'?'active':''}" data-folder="回收站"><span class="nav-label">${icon('trash')}回收站</span><span class="count">${count('回收站')}</span></button>`}
function demoControls(){return '<button class="quiet" data-action="clear-demo">清空演示资料</button><button class="quiet" data-action="reset-demo">重置示例</button>'}
function library(){screen='library';document.title='PageNest · '+folder;$('#screen').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><i class="brand-mark" aria-hidden="true"></i>PageNest</div>${nav()}<button class="quiet" data-action="new-folder">＋ 新建文件夹</button><div class="sidebar-bottom">${trashNav()}<div class="demo-controls">${demoControls()}</div></div></aside><main class="content"><div class="content-top"><div class="grow"><div class="title-row"><h1>${esc(folder)}</h1><button class="mobile-only quiet icon-button" data-action="categories" aria-label="打开分类">${icon('menu')}</button></div><p class="subtitle">${count(folder)} 份资料${folder==='回收站'?' · 可随时恢复':' · 随时接着读'}</p></div>${folder!=='回收站'?'<button class="primary" data-action="import">＋ 导入 HTML</button>':''}</div><div class="search-wrap"><i class="search-icon" aria-hidden="true"></i><input id="search" type="search" placeholder="${folder==='回收站'?'搜索回收站标题':'搜索全部资料的标题'}" aria-label="搜索资料标题" value="${esc(query)}"></div>${folders.includes(folder)?'<div class="folder-toolbar row"><button class="quiet" data-action="rename-folder">重命名</button><button class="quiet" data-action="delete-folder">删除文件夹</button></div>':''}<div class="list-heading"><span id="list-label">${query?(folder==='回收站'?'回收站的搜索结果':'全部资料的搜索结果'):'资料'}</span><span>导入时间</span></div><div id="list"></div><div class="library-footer"><span>HTML与原文，收在同一处。</span><span class="desktop-hint">所有资料均为虚构示例</span><button class="mobile-only quiet" data-action="demo-menu" style="font-size:11px">示例设置</button></div></main></div>`;renderList();$('#search').oninput=e=>{query=e.target.value;listY=0;renderList();$('#list-label').textContent=query?(folder==='回收站'?'回收站的搜索结果':'全部资料的搜索结果'):'资料'};window.scrollTo(0,listY)}
function renderList(){let shown=items.filter(x=>folder==='回收站'?x.deleted:!x.deleted);shown=shown.filter(x=>query?x.title.toLowerCase().includes(query.toLowerCase()):folder==='回收站'||folder==='全部资料'||(folder==='最近阅读'?x.read:x.folder===folder));if(folder==='最近阅读'&&!query)shown.sort((a,b)=>b.read-a.read);$('#list').innerHTML=shown.length?shown.map(x=>`<article class="item"><div class="filemark" aria-hidden="true">HTML</div><div class="item-main"><button class="item-title" data-open="${x.id}" ${x.deleted?'disabled':''}>${esc(x.title)}</button><div class="item-meta"><span>${esc(x.folder)}</span><span class="meta-sep">·</span><span>${x.source?'原文 '+x.source:x.url?'来源链接':'未附原文'}</span>${x.read?'<span class="pill">读过</span>':''}</div></div><span class="item-date">${x.date}</span>${x.deleted?`<button class="quiet" data-restore="${x.id}" aria-label="恢复 ${esc(x.title)}">恢复</button>`:`<button class="quiet icon-button" data-menu="${x.id}" aria-label="更多 ${esc(x.title)}">···</button>`}</article>`).join(''):`<div class="empty"><i class="empty-mark" aria-hidden="true"></i><h2>${query?'没有找到这份资料':folder==='回收站'?'回收站是空的':!count('全部资料')?'把第一份 HTML 放进来':'这里还没有资料'}</h2><p>${query?'换一个标题关键词，或清空搜索。':folder==='回收站'?'移入回收站的示例资料会出现在这里。':'把整理好的页面收在这里，原文可以稍后补。'}</p>${query?'<button data-action="clear-search">清空搜索</button>':folder!=='回收站'?'<button class="primary" data-action="import">导入 HTML</button>':''}</div>`}
function folderError(name,previous=''){if(!name||name.length>30)return '名称须为 1–30 字。';if(systemFolders.includes(name)||(folders.includes(name)&&name!==previous))return '这个名称已存在，请换一个。';return ''}
function createFolder(forDraft=false){openDialog('<h2 id="dialog-title">新建文件夹</h2><p class="small muted">一个简单的位置，留给相关资料。</p><div class="field"><label for="folder-name">文件夹名称</label><input id="folder-name" maxlength="30" placeholder="例如：阅读笔记"></div><div id="folder-error" class="error" role="alert"></div><div class="row actions"><button id="folder-save" class="primary">创建</button><button data-action="close-dialog">取消</button></div>');$('#folder-save').onclick=()=>{const name=$('#folder-name').value.trim(),error=folderError(name);if(error){$('#folder-error').textContent=error;return}folders.push(name);closeDialog();if(forDraft){draft.folder=name;draft.dirty=true;renderImport()}else{folder=name;query='';listY=0;library()}toast('已新建示例文件夹')};$('#folder-name').focus()}
function renameFolder(){const old=folder;openDialog(`<h2 id="dialog-title">重命名文件夹</h2><div class="field"><label for="folder-name">文件夹名称</label><input id="folder-name" value="${esc(old)}" maxlength="30"></div><div id="folder-error" class="error" role="alert"></div><div class="row actions"><button id="folder-save" class="primary">保存</button><button data-action="close-dialog">取消</button></div>`);$('#folder-save').onclick=()=>{const name=$('#folder-name').value.trim(),error=folderError(name,old);if(error){$('#folder-error').textContent=error;return}items.forEach(x=>{if(x.folder===old)x.folder=name});folders=folders.map(f=>f===old?name:f);folder=name;closeDialog();library();toast('文件夹名称已更新（示例）')}}
function deleteFolder(){const name=folder;openDialog(`<h2 id="dialog-title">删除这个文件夹？</h2><p>“${esc(name)}”中的 ${count(name)} 份资料将移到未分类，内容不会删除。</p><div class="row actions"><button id="delete-folder-confirm" class="danger">删除文件夹</button><button data-action="close-dialog">取消</button></div>`);$('#delete-folder-confirm').onclick=()=>{items.forEach(x=>{if(x.folder===name)x.folder='未分类'});folders=folders.filter(f=>f!==name);folder='未分类';query='';closeDialog();library();toast('文件夹已删除，资料已保留（示例）')}}
function moveItem(id){const x=items.find(x=>x.id===id);openDialog(`<h2 id="dialog-title">移动到文件夹</h2><p class="small muted">${esc(x.title)}</p><div class="menu">${['未分类',...folders].map(f=>`<button data-target-folder="${esc(f)}" data-target-id="${id}">${esc(f)}${f===x.folder?' ✓':''}</button>`).join('')}</div><div class="actions"><button data-action="close-dialog">取消</button></div>`)}
function itemMenu(id){const x=items.find(x=>x.id===id);openDialog(`<h2 id="dialog-title">资料操作</h2><p class="small muted">${esc(x.title)}</p><div class="menu"><button data-move="${id}">移动到文件夹</button><button data-edit="${id}">编辑标题与分类</button><button data-source="${id}">补充或编辑原文</button><button data-download="${id}">下载文件（演示）</button><button class="danger" data-trash="${id}">移到回收站</button></div>${screen==='reader'?'<details class="simulation"><summary>设计状态演示</summary><button data-action="preview-error">查看加载失败</button></details>':''}<div class="actions"><button data-action="close-dialog">关闭</button></div>`)}
function downloadMenu(id){const x=items.find(x=>x.id===id);openDialog(`<h2 id="dialog-title">下载文件</h2><p class="small muted">此设计稿只提供虚构示例，不涉及私人文件。</p><div class="menu"><button id="download-html">下载示例 HTML</button>${x.source?'<button id="download-source">下载示例原文说明（TXT）</button>':''}</div><div class="actions"><button data-action="close-dialog">关闭</button></div>`);const save=(text,name,type)=>{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载虚构示例')};$('#download-html').onclick=()=>save('<!doctype html><meta charset="utf-8"><title>虚构阅读示例</title><h1>虚构阅读示例</h1><p>此文件仅供 PageNest 设计演示。</p>','PageNest-虚构示例.html','text/html');if($('#download-source'))$('#download-source').onclick=()=>save(sourceText,'PageNest-虚构原文.txt','text/plain')}
function editItem(id){const x=items.find(x=>x.id===id);openDialog(`<h2 id="dialog-title">编辑资料</h2><div class="field"><label for="edit-title">标题</label><input id="edit-title" value="${esc(x.title)}" maxlength="120"></div><div class="field"><label for="edit-folder">文件夹</label><select id="edit-folder">${options(x.folder)}</select></div><div class="error" id="edit-error" role="alert"></div><div class="row actions"><button id="edit-save" class="primary">保存</button><button data-action="close-dialog">取消</button></div>`);$('#edit-save').onclick=()=>{const title=$('#edit-title').value.trim();if(!title||title.length>120){$('#edit-error').textContent='标题须为 1–120 字。';return}x.title=title;x.folder=$('#edit-folder').value;closeDialog();if(screen==='reader'){savePosition();reader()}else library();toast('资料已更新（示例）')}}
function saveListPosition(){listY=window.scrollY}
function startImport(){clearTimeout(toastTimer);$('#toast').hidden=true;saveListPosition();draft={selected:false,title:'',folder:folders.includes(folder)||folder==='未分类'?folder:'未分类',source:'',url:'',fail:false,dirty:false,variant:'normal'};renderImport();window.scrollTo(0,0)}
function renderImport(){screen='import';document.title='PageNest · 导入';$('#screen').innerHTML=`<main class="form-page"><button class="quiet" data-action="cancel-import">← 返回资料库</button><h1>导入 HTML</h1><p class="muted">选择一份 HTML，收进自己的资料库。</p>${draft.selected?`<div class="file-ready row between"><div class="grow"><strong>${draft.variant==='wide'?'宽页面示例.html':'我的阅读笔记.html'}</strong><p class="small muted">示例 HTML · 未读取本地文件</p></div><button class="quiet" data-action="select-demo">更换示例</button></div>`:'<div class="drop"><span class="filemark" style="margin:0 auto 18px" aria-hidden="true">HTML</span><strong>从一份整理好的页面开始</strong><p>本原型使用虚构示例，不读取本地文件。</p><button class="primary" data-action="select-demo">选择示例 HTML</button></div>'}<div class="field"><label for="import-title">标题</label><input id="import-title" maxlength="120" value="${esc(draft.title)}" placeholder="选择示例后自动填写" ${draft.selected?'':'disabled'}></div><div class="field"><label for="import-folder">保存到</label><div class="field-inline"><select id="import-folder">${options(draft.folder)}</select><button data-action="draft-folder">＋ 新建</button></div></div><details class="source-options" ${draft.source||draft.url?'open':''}><summary>附上来源资料<span class="optional">可选</span></summary><p class="small muted">HTML 只需导入一次。需要核对来源时，再附原文件或链接。</p><div class="field"><label for="import-source">来源文件<span class="optional">可选</span></label><select id="import-source">${sourceOptions(draft.source)}</select><p class="small muted">PDF / TXT / HTML；没有来源也可以直接保存。</p></div><div class="field"><label for="source-url">来源链接<span class="optional">可选</span></label><input id="source-url" type="url" inputmode="url" placeholder="https://…" value="${esc(draft.url)}"><p class="small muted">只接受 HTTPS；保存链接不代表保存网页正文。</p></div></details><details class="simulation"><summary>演示保存失败</summary><label><input id="fail-save" type="checkbox" ${draft.fail?'checked':''}> 下一次保存失败，保留填写内容</label></details><div class="error" id="import-error" role="alert"></div><div class="row form-footer"><button id="save-import" class="primary" ${draft.selected?'':'disabled'}>保存并阅读</button><button data-action="cancel-import">取消</button></div></main>`;for(const [selector,key] of [['#import-title','title'],['#import-folder','folder'],['#import-source','source'],['#source-url','url']])$(selector).oninput=e=>{draft[key]=e.target.value;draft.dirty=true};$('#fail-save').onchange=e=>{draft.fail=e.target.checked;draft.dirty=true};$('#save-import').onclick=saveImport}
function selectDemo(){openDialog('<h2 id="dialog-title">选择示例 HTML</h2><p class="small muted">这里不访问你的电脑文件。</p><div class="menu"><button data-sample="normal">我的阅读笔记.html · 图文与展开</button><button data-sample="wide">宽页面示例.html · 固定宽度</button><button data-sample="duplicate">重复示例 · 已有资料</button><button data-sample="invalid">类型错误示例 · 笔记.docx</button></div><div id="sample-error" class="error" role="alert"></div><div class="actions"><button data-action="close-dialog">取消</button></div>')}
function validURL(value){if(!value)return true;try{const u=new URL(value);return u.protocol==='https:'&&!!u.hostname}catch{return false}}
function commitImport(){const title=draft.title.trim(),url=draft.url.trim();if(!title||title.length>120){$('#import-error').textContent='标题须为 1–120 字。';return}if(!validURL(url)){$('#import-error').textContent='请填写完整的 HTTPS 链接，或留空。';return}if(draft.fail){draft.fail=false;$('#fail-save').checked=false;$('#import-error').textContent='演示：未保存成功，填写内容已保留。请重试。';return}const x={id:nextId++,title,folder:draft.folder,source:draft.source,url,type:draft.variant,read:0,date:'10月13日',deleted:false};items.unshift(x);draft=null;openReader(x.id);toast('已加入示例资料库；刷新后重置')}
function saveImport(){if(!draft.title.trim()||!validURL(draft.url.trim())||draft.fail){commitImport();$('#import-error')?.scrollIntoView({block:'nearest'});return}document.querySelectorAll('.form-page button,.form-page input,.form-page select').forEach(b=>b.disabled=true);$('#save-import').textContent='正在保存…';$('#import-error').innerHTML='<span class="muted">正在保存示例资料</span><div class="loading-line"></div>';setTimeout(commitImport,650)}
function cancelImport(){if(draft.dirty||draft.selected)openDialog('<h2 id="dialog-title">放弃这次导入？</h2><p>尚未保存的填写内容将被丢弃。</p><div class="row actions"><button data-action="discard-import" class="danger">放弃导入</button><button class="primary" data-action="close-dialog">继续填写</button></div>');else{draft=null;library()}}
function article(x,asSource=false){return `<article class="article ${x.type==='wide'&&!asSource?'wide-doc':''}"><div class="eyebrow">${asSource?'HTML 原文示例':'阅读示例 · 虚构资料'}</div><h1>${esc(asSource?'从观察开始的一份笔记':x.title)}</h1><p class="lead">有些内容适合快读，有些值得停下来。把一份资料收好，也是为下一次阅读留一个位置。</p><div class="quote">让整理后的内容好读，让它的来源随时可查。</div><h2>01　从一页笔记开始</h2><p>想象一个安静的下午，你把零散的观察整理成一张页面：几段文字，一幅小图，以及一个暂时还没有答案的问题。</p><figure class="figure"><div class="figure-art" role="img" aria-label="虚构的绿色花园插图"><i class="sun"></i><i class="hill back"></i><i class="hill"></i><i class="stem"></i></div><figcaption>图 01 · 为原型绘制的花园示意，无外部图片</figcaption></figure><p>资料不必在保存的一刻就被彻底分类。先留下，再按自己的节奏阅读和整理。一层简单的文件夹，也能为相关页面提供清晰的归处。</p><div class="steps"><div class="step"><span>留住</span><strong>一份完整页面</strong><p>文字与图像一起阅读。</p></div><div class="step"><span>核对</span><strong>回到原始资料</strong><p>HTML旁边保留来源。</p></div><div class="step"><span>继续</span><strong>从上次停下的地方</strong><p>当前会话记住阅读位置。</p></div></div><details><summary>展开阅读：这张页面有什么可观察的？</summary><p>这里使用原生展开交互。你可以观察段落、图文层次和阅读宽度；切换视图后，阅读位置各自保留。所有内容均为原型虚构样本。</p></details>${x.type==='wide'&&!asSource?'<h2>02　宽表格示例</h2><table class="wide-table"><thead><tr><th>示例材料</th><th>观察角度</th><th>整理形式</th><th>下一次阅读</th><th>原文关联</th></tr></thead><tbody><tr><td>花园观察笔记</td><td>日常中的细节</td><td>图文页面</td><td>从第三段继续</td><td>示例纯文本</td></tr><tr><td>阅读方式记录</td><td>内容的不同节奏</td><td>固定宽度表格</td><td>核对观察说明</td><td>模拟 PDF</td></tr><tr><td>一份整理草稿</td><td>目录和视觉层次</td><td>长文与展开</td><td>从开头重读</td><td>来源链接</td></tr></tbody></table>':'<h2>02　让页面保持自己的样子</h2><p>不同资料可以拥有不同的视觉层次。一页观察笔记和一份技术说明，不需要读起来完全一样。</p>'}<h2>03　整理与原文相伴</h2><p>HTML方便理解，原文帮助核对。没有原文时也可以先阅读，之后再补上文件或链接。仅有链接时，不能据此认为已经保存网页正文。</p><p>这些段落仅用于检查阅读器的版式和滚动。试着在这里切到原文，然后回到HTML，看看是否仍停在同一个位置。</p><h2>04　留一点空间给重读</h2><p>第一次阅读关注结论，第二次可能留意细节。资料库的意义，不只在于收集，也在于让内容有一个容易返回的位置。</p><p>当前原型只在页面内保存演示状态。刷新会重置条目、文件夹与阅读位置；这里没有真实文件存储或跨设备同步。</p><h2>读到这里</h2><p>你可以返回资料库，编辑标题、移动到其他文件夹，或将示例资料移入回收站后再恢复。</p></article>`}
const sourceText='【原文纯文本示例 · 虚构资料】\n\n阅读与花园\n\n一个安静的下午，观察者把几段零散的记录整理到同一张页面。文字与小图共同保留当时的理解。\n\n观察一\n\n叶片的形态会影响我们怎样描述一株植物。先写下观察，再决定如何归类，比一开始建立复杂目录更容易坚持。\n\n观察二\n\n重读时，注意力常常会发生变化。第一次留意结论，第二次可能想确认材料的来源。HTML和原文因此需要各自的位置。\n\n观察三\n\n一层文件夹只负责归类。移动资料不改变内容；删掉文件夹，资料仍可留在未分类中。\n\n原始记录\n\n午后的光线变得柔和，纸上留下几行简短的句子。整理不是为了替代原始材料，而是为了下次能够重新找到它。\n\n后续备注\n\n原文文件和来源链接由用户关联。仅有链接不意味着已有副本，也不能证明整理内容与来源完全一致。\n\n阅读位置\n\n这个原型演示当前页面会话内的位置恢复。真实保存、跨设备读回和文件隔离，都需要开发阶段另外实现与验证。\n\n结束语\n\n这是一份用于交互与排版审核的虚构文本，不对应真实论文或私人记录。\n\n—— 示例结束 ——';
function source(x){if(!x.source&&!x.url)return '<div class="empty"><i class="empty-mark" aria-hidden="true"></i><h2>还没有添加原文</h2><p>可以补一份文件，或留下来源链接。</p><button class="primary" data-action="add-source">补充原文</button></div>';const link=x.url?`<div class="link-card"><strong>${esc(new URL(x.url).hostname)}</strong><p>${esc(x.url)}</p>${!x.source?'<p class="muted">尚未保存原文副本</p>':''}<button data-action="open-link">打开原网站（演示） ↗</button></div>`:'';if(x.source==='HTML')return `<div class="source-sheet"><div class="source-head row between"><div><h3>示例原文.html</h3><p class="small muted">虚构 HTML 原文 · 非用户文件</p></div><button data-action="add-source">编辑原文</button></div>${link}</div>${article(x,true)}`;return `<div class="source-sheet"><div class="source-head row between"><div><h3>${x.source?'示例原文.'+x.source.toLowerCase():'原文链接'}</h3><p class="small muted">${x.source==='PDF'?'PDF 预览示例 · 非真实 PDF':x.source?'虚构原始文本':'只有来源入口'}</p></div><button data-action="add-source">编辑原文</button></div>${link}${x.source==='TXT'?`<pre>${esc(sourceText)}</pre>`:x.source==='PDF'?`<div class="pdf-tools"><button data-page="-1" aria-label="上一页" ${(x.page||1)===1?'disabled':''}>←</button><span>第 ${x.page||1} / 3 页</span><button data-page="1" aria-label="下一页" ${(x.page||1)===3?'disabled':''}>→</button></div><div class="pdf-sheet"><div class="pdf-label">PDF 预览示例 · ${x.page||1}</div><h2>${['观察的起点','整理的方式','再次阅读'][ (x.page||1)-1]}</h2><p>这是一张模拟的 PDF 页面，用于审核页码交互和窄屏阅读布局。</p><p>${['从一份观察开始，留下文字、图像与问题。阅读的节奏可以由自己决定。','将HTML与原文放在同一条目中，分类只负责让资料更容易找回。','每次重读都有不同的关注点，原始资料为核对提供一个稳定入口。'][(x.page||1)-1]}</p><p>这里没有加载 PDF 文件，也没有实现 PDF 渲染器。页码只在当前演示会话内保留。</p><p class="small muted">虚构资料 · 非研究结论</p></div>`:''}</div>`}
function savePosition(){const el=$('#read-scroll');if(current&&el)positions[current.id+':'+view]={top:el.scrollTop,left:el.scrollLeft}}
function openReader(id){const x=items.find(x=>x.id===id&&!x.deleted);if(!x)return;if(screen==='library')saveListPosition();current=x;current.read=++readOrder;view='HTML';fit=false;reader();window.scrollTo(0,0);if(positions[id+':HTML']?.top)toast('已回到本次会话的阅读位置')}
function applyFit(){const doc=$('.wide-doc');if(doc)doc.style.zoom=fit?Math.min(1,$('#read-scroll').clientWidth/920):1}
function readingBody(){return `${current.type==='wide'&&view==='HTML'?`<div class="notice row between"><span>${fit?'适合屏幕 · 内容缩小展示':'固定宽度示例 · 仅正文可横向滚动'}</span><button data-action="fit">${fit?'原始大小':'适合屏幕'}</button></div>`:''}<div id="read-scroll" class="read-scroll" tabindex="0" aria-label="阅读正文">${view==='HTML'?article(current):source(current)}</div>`}
function restorePosition(){applyFit();const p=positions[current.id+':'+view];if(p){$('#read-scroll').scrollTop=p.top;$('#read-scroll').scrollLeft=p.left}$('#read-scroll').onscroll=savePosition}
function reader(){screen='reader';document.title='PageNest · '+current.title;$('#screen').innerHTML=`<main class="reader"><div class="reader-top"><button class="quiet" data-action="back" aria-label="返回资料库">←<span class="reader-back-label"> 返回</span></button><div class="reader-title">${esc(current.title)}</div><div class="reader-actions"><div class="reader-tabs" data-active="${view}" role="group" aria-label="阅读内容"><span class="tabs-indicator" aria-hidden="true"></span><button data-view="HTML" class="${view==='HTML'?'selected':''}" aria-pressed="${view==='HTML'}">HTML</button><button data-view="原文" class="${view==='原文'?'selected':''}" aria-pressed="${view==='原文'}">原文</button></div><button class="quiet reader-start" data-action="read-start">从头阅读</button><button class="quiet reader-more" data-action="more">更多</button></div></div><div class="reader-body">${readingBody()}</div></main>`;restorePosition()}
function switchView(next){if(next===view)return;savePosition();view=next;const tabs=$('.reader-tabs');tabs.dataset.active=view;tabs.querySelectorAll('[data-view]').forEach(button=>{const selected=button.dataset.view===view;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))});$('.reader-body').innerHTML=readingBody();restorePosition()}
function addSource(id=current?.id){const x=items.find(x=>x.id===id);openDialog(`<h2 id="dialog-title">补充原文</h2><p class="small muted">使用虚构示例，不读取或上传本地文件。</p><div class="field"><label for="edit-source">原文文件<span class="optional">可选</span></label><select id="edit-source">${sourceOptions(x.source)}</select></div><div class="field"><label for="edit-url">HTTPS 来源链接<span class="optional">可选</span></label><input id="edit-url" type="url" value="${esc(x.url)}" placeholder="https://…"></div><div class="error" id="source-error" role="alert"></div><div class="row actions"><button id="source-save" class="primary">保存</button><button data-action="close-dialog">取消</button></div>`);$('#source-save').onclick=()=>{const url=$('#edit-url').value.trim();if(!validURL(url)){$('#source-error').textContent='请输入完整的 HTTPS 链接，或留空。';return}const next=$('#edit-source').value;if(screen==='reader')savePosition();if(x.source!==next){delete positions[x.id+':原文'];x.page=1}x.source=next;x.url=url;closeDialog();if(screen==='reader')reader();else library();toast('原文关联已更新（示例）')}}
function categories(){openDialog(`<div class="row between"><div class="brand"><i class="brand-mark" aria-hidden="true"></i>PageNest</div><button class="quiet" data-action="close-dialog" aria-label="关闭分类">×</button></div><h2 id="dialog-title" class="hidden">分类</h2>${nav()}<button class="quiet" data-action="new-folder">＋ 新建文件夹</button><div style="margin-top:28px">${trashNav()}</div><div class="drawer-controls">${demoControls()}</div>`,true)}
function trashItem(id){const x=items.find(x=>x.id===id);openDialog(`<h2 id="dialog-title">移到回收站？</h2><p>“${esc(x.title)}”可以在回收站恢复。</p><div class="row actions"><button id="trash-confirm" class="danger">移到回收站</button><button data-action="close-dialog">取消</button></div>`);$('#trash-confirm').onclick=()=>{if(screen==='reader')savePosition();x.deleted=true;closeDialog();library();toast('已移入回收站（示例）',()=>restoreItem(id))}}
function restoreItem(id){const x=items.find(x=>x.id===id);x.deleted=false;if(!folders.includes(x.folder))x.folder='未分类';library();toast('已恢复到 '+x.folder+'（示例）')}
function resetDemo(){folders=['AI 学习','产品设计','工作资料'];items=initialItems.map(x=>({...x}));positions={};current=null;draft=null;folder='全部资料';query='';listY=0;nextId=5;readOrder=1;closeDialog();library();toast('示例已重置')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.folder){folder=d.folder;query='';listY=0;closeDialog();library();return}

 if(d.menu){itemMenu(Number(d.menu));return}

 if(d.edit){editItem(Number(d.edit));return}
 if(d.source){addSource(Number(d.source));return}
 if(d.download){downloadMenu(Number(d.download));return}
 if(d.trash){trashItem(Number(d.trash));return}
 if(d.restore){restoreItem(Number(d.restore));return}
 if(d.targetFolder){const x=items.find(x=>x.id===Number(d.targetId)),old=x.folder;x.folder=d.targetFolder;closeDialog();if(screen==='reader'){savePosition();reader()}else library();toast('已移到 '+x.folder+'（示例）',()=>{x.folder=folders.includes(old)?old:'未分类';if(screen==='reader'){savePosition();reader()}else library();toast('已撤销移动（示例）')});return}
 if(d.view){switchView(d.view);return}
 if(d.page){savePosition();current.page=Math.max(1,Math.min(3,(current.page||1)+Number(d.page)));delete positions[current.id+':原文'];reader();return}
 if(d.sample){if(d.sample==='invalid'){$('#sample-error').textContent='类型错误示例：请选择 .html / .htm 文件。';return}if(d.sample==='duplicate'){const existing=items.find(x=>x.id===1&&!x.deleted);if(existing){openDialog('<h2 id="dialog-title">这份资料已存在</h2><p>重复示例不会覆盖原条目。</p><div class="row actions"><button id="open-existing" class="primary">打开已有资料</button><button data-action="close-dialog">返回导入</button></div>');$('#open-existing').onclick=()=>{closeDialog();draft=null;openReader(existing.id)}}else{$('#sample-error').textContent='示例资料已移除，请选择其他示例。'}return}draft.selected=true;draft.dirty=true;draft.variant=d.sample;draft.title=d.sample==='wide'?'宽页面：我的阅读笔记':'Agent 记忆：我的阅读笔记';closeDialog();renderImport();return}
 switch(d.action){case'new-folder':createFolder();break;case'draft-folder':createFolder(true);break;case'close-dialog':closeDialog();break;case'import':startImport();break;case'select-demo':selectDemo();break;case'cancel-import':cancelImport();break;case'discard-import':draft=null;closeDialog();library();break;case'clear-search':query='';library();break;case'back':savePosition();library();break;case'read-start':delete positions[current.id+':'+view];if(view==='原文'&&current.source==='PDF')current.page=1;reader();break;case'fit':savePosition();fit=!fit;reader();break;case'add-source':addSource();break;case'categories':categories();break;case'rename-folder':renameFolder();break;case'delete-folder':deleteFolder();break;case'more':itemMenu(current.id);break;case'preview-error':closeDialog();$('.reader-body').innerHTML='<div class="empty"><i class="empty-mark" aria-hidden="true"></i><h2>暂时无法显示这份 HTML</h2><p>原文件仍然保留。可以重试，或切换原文继续阅读。</p><div class="row" style="justify-content:center;margin-top:18px"><button class="primary" data-action="retry-preview">重新加载</button><button data-download="'+current.id+'">下载 HTML</button></div><p class="small muted" style="margin-top:20px">设计状态演示 · 非实际文件错误</p></div>';break;case'retry-preview':$('.reader-body').innerHTML='<div class="empty" role="status"><h2>正在打开资料…</h2><div class="loading-line"></div></div>';setTimeout(()=>reader(),550);break;case'open-link':toast('来源链接演示：正式版将打开原网站；当前不联网');break;case'undo':{const undo=undoAction;undoAction=null;$('#toast').hidden=true;if(undo)undo();break}case'demo-menu':openDialog('<h2 id="dialog-title">示例设置</h2><p class="small muted">仅改变演示资料，刷新也可重置。</p><div class="menu">'+demoControls()+'</div><div class="actions"><button data-action="close-dialog">关闭</button></div>');break;case'clear-demo':openDialog('<h2 id="dialog-title">清空演示资料？</h2><p>用于查看首次使用的空态。可用“重置示例”恢复，或直接刷新页面。</p><div class="row actions"><button id="clear-confirm" class="danger">清空示例</button><button data-action="close-dialog">取消</button></div>');$('#c
